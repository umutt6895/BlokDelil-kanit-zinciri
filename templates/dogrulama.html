{% extends "base.html" %}

{% block title %}Kanıt Doğrula{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">

    <div class="text-center mb-4">
      <div class="eyebrow">Modül 03</div>
      <h2 class="brand-title">Kanıt Doğrula</h2>
      <p class="text-muted mb-0">Şüpheli bir video dosyasının hash'ini hesaplar ve zincirdeki kayıtlarla karşılaştırır.</p>
    </div>

    <!-- ============================================================= -->
    <!-- KANIT DOĞRULAMA FORMU (htmx)                                   -->
    <!-- ============================================================= -->
    <div class="panel-card">
      <div class="panel-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>
        </svg>
      </div>

      <form hx-post="/api/video_dogrula"
            hx-encoding="multipart/form-data"
            hx-target="#dogrulama-sonuc"
            hx-swap="innerHTML">
        <div class="mb-3">
          <label for="dogrulaDosya">Şüpheli Video Dosyası</label>
          <input type="file" class="form-control" id="dogrulaDosya" name="video" accept="video/*" required>
        </div>
        <button type="submit" class="btn btn-chain w-100">
          Kanıtı Doğrula <span class="htmx-indicator">···</span>
        </button>
        <div id="dogrulama-sonuc" class="mt-3"></div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
