{% extends "base.html" %}

{% block title %}Kamera Kayıt{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">

    <div class="text-center mb-4">
      <div class="eyebrow">Modül 01</div>
      <h2 class="brand-title">Kamera Kayıt</h2>
      <p class="text-muted mb-0">Yeni bir yaka kamerası için RSA anahtar çifti üretir ve genel anahtarı zincire kaydeder.</p>
    </div>

    <!-- ============================================================= -->
    <!-- KAMERA KAYIT FORMU (Alpine.js + fetch)                         -->
    <!-- Bu form HTMX ile DEĞİL, Alpine + fetch ile yönetilir çünkü     -->
    <!-- /api/kamera_ekle endpoint'i JSON döner ve private_key'in       -->
    <!-- ekranda özel bir kutuda gösterilmesi gerekir.                  -->
    <!-- ============================================================= -->
    <div class="panel-card" x-data="kameraKayit()">
      <div class="panel-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </div>

      <form @submit.prevent="gonder()">
        <div class="mb-3">
          <label for="kameraId">KameraID</label>
          <input type="number" class="form-control" id="kameraId" name="KameraID" x-model="kameraId" required>
        </div>
        <div class="mb-3">
          <label for="cihazAdi">CihazAdi</label>
          <input type="text" class="form-control" id="cihazAdi" name="CihazAdi" x-model="cihazAdi" required placeholder="örn. Yaka-Kam-001">
        </div>
        <button type="submit" class="btn btn-chain w-100" :disabled="yukleniyor">
          <span x-show="!yukleniyor">Kamera Oluştur</span>
          <span x-show="yukleniyor" x-cloak>Oluşturuluyor...</span>
        </button>
      </form>

      <div class="mt-3" x-show="mesaj" x-cloak>
        <div class="p-3 rounded-3" :class="basarili ? 'sonuc-basarili' : 'sonuc-hata'" x-text="mesaj"></div>
      </div>

      <div class="private-key-box" x-show="privateKey" x-cloak>
        <div class="warn-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l9 16H3L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/>
          </svg>
          Lütfen kopyalayın — bir daha gösterilmeyecek
        </div>
        <textarea class="form-control" rows="6" readonly autocomplete="off" x-text="privateKey" @click="$event.target.select()"></textarea>
        <button type="button" class="btn btn-sm btn-outline-chain mt-2" @click="kopyala()">
          <span x-show="!kopyalandi">Private Key'i Kopyala</span>
          <span x-show="kopyalandi" x-cloak>Kopyalandı ✓</span>
        </button>
      </div>
    </div>

  </div>
</div>
{% endblock %}
